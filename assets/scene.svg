<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="An old Kolkata room before dawn: a family gathered around a glowing valve radio, with kash flowers on the windowsill and the sky just beginning to lighten outside.">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1230"/>
      <stop offset="45%" stop-color="#241a36"/>
      <stop offset="100%" stop-color="#140f2e"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1640"/>
      <stop offset="38%" stop-color="#3a2a58"/>
      <stop offset="70%" stop-color="#8a5a63"/>
      <stop offset="100%" stop-color="#e8a765"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2042"/>
      <stop offset="100%" stop-color="#150f26"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdd8a" stop-opacity=".95"/>
      <stop offset="40%" stop-color="#f3b45c" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#f3b45c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="radioGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9ad" stop-opacity=".9"/>
      <stop offset="55%" stop-color="#f2d54a" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#f2d54a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="72%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0718" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="shutterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f5a4d"/>
      <stop offset="100%" stop-color="#2b4038"/>
    </linearGradient>
    <linearGradient id="cabinetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3c28"/>
      <stop offset="100%" stop-color="#3a2516"/>
    </linearGradient>
    <linearGradient id="rugGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a2e2a"/>
      <stop offset="50%" stop-color="#9a4330"/>
      <stop offset="100%" stop-color="#7a2e2a"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="windowClip">
      <path d="M150 560 V280 Q150 150 300 150 Q450 150 450 280 V560 Z"/>
    </clipPath>
    <path id="kfBody" d="M -70 0 Q -80 -50 -40 -80 Q -55 -115 -55 -130 Q -56 -150 -20 -158 Q 0 -163 20 -158 Q 56 -150 55 -130 Q 55 -115 40 -80 Q 80 -50 70 0 Q 0 14 -70 0 Z"/>
  </defs>

  <!-- room -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#wallGrad)"/>
  <rect x="0" y="600" width="1600" height="300" fill="url(#floorGrad)"/>

  <!-- faint plaster streaks for an aged wall -->
  <g opacity=".08" stroke="#f4efe2" stroke-width="2">
    <path d="M90 0 V560"/>
    <path d="M1180 0 V540"/>
    <path d="M1260 0 V600"/>
    <path d="M1480 0 V520"/>
    <path d="M1360 40 V300"/>
  </g>

  <!-- window with pre-dawn sky -->
  <g>
    <path d="M140 570 V270 Q140 130 300 130 Q460 130 460 270 V570 Z" fill="#0d0a1c"/>
    <g clip-path="url(#windowClip)">
      <rect x="150" y="150" width="300" height="420" fill="url(#skyGrad)"/>
      <!-- distant old-Kolkata skyline -->
      <g fill="#140f2e" opacity=".85">
        <rect x="150" y="470" width="42" height="100"/>
        <rect x="196" y="440" width="34" height="130"/>
        <path d="M230 440 L247 405 L264 440 Z"/>
        <rect d="" x="264" y="455" width="54" height="115"/>
        <circle cx="291" cy="430" r="16"/>
        <rect x="320" y="485" width="40" height="85"/>
        <rect x="364" y="450" width="30" height="120"/>
        <path d="M394 450 Q410 420 426 450 Z"/>
        <rect x="426" y="465" width="24" height="105"/>
      </g>
      <!-- wires and birds -->
      <path d="M150 300 Q300 340 450 290" stroke="#140f2e" stroke-width="2" fill="none" opacity=".6"/>
      <g stroke="#140f2e" stroke-width="3" stroke-linecap="round" opacity=".7">
        <path d="M250 260 q8 -8 16 0"/>
        <path d="M300 245 q8 -8 16 0"/>
      </g>
      <circle class="kf-moon" cx="380" cy="205" r="20" fill="#f4efe2" opacity=".85"/>
    </g>
    <!-- shutters -->
    <g fill="url(#shutterGrad)" stroke="#1c2b24" stroke-width="2">
      <path d="M140 570 V270 Q140 150 220 135 V570 Z"/>
      <path d="M460 570 V270 Q460 150 380 135 V570 Z"/>
    </g>
    <g stroke="#1c2b24" stroke-width="2" opacity=".6">
      <path d="M160 200 V560 M185 190 V565 M210 180 V568"/>
      <path d="M440 200 V560 M415 190 V565 M390 180 V568"/>
    </g>
    <!-- windowsill -->
    <rect x="120" y="566" width="360" height="18" rx="3" fill="#2a2042"/>
    <!-- kash phul in a vase -->
    <g transform="translate(160,470)">
      <path d="M0 96 Q-4 60 6 30" stroke="#3a6b4a" stroke-width="4" fill="none"/>
      <path d="M14 96 Q10 50 20 18" stroke="#3a6b4a" stroke-width="4" fill="none"/>
      <path d="M28 96 Q26 55 34 28" stroke="#3a6b4a" stroke-width="4" fill="none"/>
      <g class="kf-sway" style="transform-origin:10px 20px;">
        <ellipse cx="6" cy="24" rx="16" ry="9" fill="#f4efe2" opacity=".92"/>
        <ellipse cx="18" cy="12" rx="15" ry="8" fill="#f4efe2" opacity=".88"/>
        <ellipse cx="32" cy="22" rx="14" ry="8" fill="#f4efe2" opacity=".9"/>
        <ellipse cx="22" cy="2" rx="13" ry="7" fill="#f8f3e6"/>
      </g>
      <path d="M-6 96 Q0 108 10 110 Q20 108 26 96 Z" fill="#7a3a28"/>
    </g>
  </g>

  <!-- floor rug -->
  <path d="M250 900 L520 650 L1150 650 L1480 900 Z" fill="url(#rugGrad)" opacity=".9"/>
  <path d="M250 900 L520 650 L1150 650 L1480 900" fill="none" stroke="#f2d54a" stroke-opacity=".25" stroke-width="4"/>

  <!-- ambient lamp glow pooling on the rug -->
  <ellipse cx="880" cy="760" rx="420" ry="140" fill="url(#lampGlow)" opacity=".5"/>

  <!-- family, seated on the rug around the radio, seen from behind/three-quarter -->
  <g id="kf-family">
    <!-- grandmother, left, shawl drawn over her head -->
    <g transform="translate(630,780)">
      <ellipse cx="0" cy="10" rx="78" ry="14" fill="#05030c" opacity=".3"/>
      <use href="#kfBody" fill="#2a1d3d"/>
      <circle cx="0" cy="-186" r="33" fill="#2a1d3d"/>
      <path d="M-40 -215 Q0 -250 40 -215 Q46 -160 34 -110 Q18 -150 0 -152 Q-18 -150 -34 -110 Q-46 -160 -40 -215 Z" fill="#1f1530" opacity=".92"/>
    </g>
    <!-- mother, centre, aanchal draped over one shoulder -->
    <g transform="translate(845,800)">
      <ellipse cx="0" cy="10" rx="82" ry="15" fill="#05030c" opacity=".3"/>
      <use href="#kfBody" fill="#2e2044"/>
      <circle cx="0" cy="-186" r="33" fill="#2e2044"/>
      <circle cx="4" cy="-212" r="13" fill="#23182f"/>
      <path d="M-30 -150 Q10 -60 36 10 L18 16 Q-6 -60 -46 -140 Z" fill="#7a2e2a" opacity=".85"/>
    </g>
    <!-- child, nestled beside her -->
    <g transform="translate(944,812) scale(.56)">
      <ellipse cx="0" cy="10" rx="78" ry="14" fill="#05030c" opacity=".22"/>
      <use href="#kfBody" fill="#342650"/>
      <circle cx="0" cy="-192" r="38" fill="#342650"/>
    </g>
    <!-- father, right, listening with head tilted toward the radio -->
    <g transform="translate(1080,775)">
      <ellipse cx="0" cy="10" rx="80" ry="14" fill="#05030c" opacity=".3"/>
      <use href="#kfBody" fill="#271a39"/>
      <g transform="rotate(-8)">
        <circle cx="0" cy="-186" r="33" fill="#271a39"/>
      </g>
      <path d="M-30 -168 Q-50 -120 -46 -40 L-30 -40 Q-32 -118 -14 -164 Z" fill="#3a2a4a" opacity=".8"/>
    </g>
  </g>

  <!-- low wooden stool -->
  <rect x="845" y="640" width="150" height="16" rx="4" fill="#4a2f1c"/>
  <rect x="860" y="656" width="14" height="46" fill="#3a2516"/>
  <rect x="966" y="656" width="14" height="46" fill="#3a2516"/>

  <!-- vintage valve radio -->
  <g id="kf-radio" transform="translate(850,520)">
    <ellipse cx="70" cy="128" rx="150" ry="26" fill="#05030c" opacity=".4" filter="url(#soft)"/>
    <circle id="kf-radioGlow" cx="70" cy="60" r="130" fill="url(#radioGlow)"/>
    <rect x="-10" y="-10" width="160" height="130" rx="14" fill="url(#cabinetGrad)" stroke="#22150c" stroke-width="3"/>
    <rect x="2" y="2" width="136" height="100" rx="8" fill="#241a12"/>
    <!-- speaker grille -->
    <g stroke="#caa172" stroke-width="2.5" opacity=".55">
      <path d="M14 10 V96"/><path d="M26 6 V100"/><path d="M38 10 V96"/><path d="M50 6 V100"/>
      <path d="M62 10 V96"/>
    </g>
    <!-- dial -->
    <g transform="translate(103,52)">
      <circle r="30" fill="#140f2e" stroke="#f2d54a" stroke-width="2" opacity=".9"/>
      <circle r="24" fill="#1c1430"/>
      <g id="kf-needle" style="transform-origin:0px 0px;">
        <line x1="0" y1="0" x2="0" y2="-19" stroke="#f3cf7a" stroke-width="2.5" stroke-linecap="round"/>
        <circle r="3" fill="#f3cf7a"/>
      </g>
    </g>
    <rect x="30" y="112" width="80" height="10" rx="4" fill="#1c1208"/>
    <path d="M118 -10 L150 -70" stroke="#2a1c10" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- diya beside the radio -->
  <g transform="translate(760,610)">
    <circle cx="0" cy="-6" r="40" fill="url(#lampGlow)" opacity=".8"/>
    <path d="M-22 6 Q0 24 22 6 Q22 -6 0 -4 Q-22 -6 -22 6 Z" fill="#8a5a28"/>
    <path id="kf-flame" class="kf-flicker" d="M0 -8 Q6 -22 0 -34 Q-6 -22 0 -8 Z" fill="#ffdd8a" style="transform-origin:0px -8px;"/>
  </g>

  <!-- incense smoke -->
  <path class="kf-smoke" d="M1140 580 Q1150 540 1136 500 Q1124 464 1140 430" stroke="#f4efe2" stroke-width="3" fill="none" opacity=".18" stroke-linecap="round"/>

  <!-- dust motes -->
  <g class="kf-motes" fill="#f3cf7a">
    <circle cx="700" cy="420" r="2.2" opacity=".5"/>
    <circle cx="960" cy="380" r="1.6" opacity=".4"/>
    <circle cx="1080" cy="460" r="2" opacity=".45"/>
    <circle cx="820" cy="340" r="1.4" opacity=".35"/>
  </g>

  <rect x="0" y="0" width="1600" height="900" fill="url(#vignette)"/>

  <style>
    .kf-flicker{animation:kfFlicker 2.6s ease-in-out infinite}
    @keyframes kfFlicker{0%,100%{transform:scaleY(1) translateX(0)}30%{transform:scaleY(1.08) translateX(-1px)}55%{transform:scaleY(.92) translateX(1px)}80%{transform:scaleY(1.04)}}
    .kf-smoke{animation:kfSmoke 7s ease-in-out infinite}
    @keyframes kfSmoke{0%,100%{opacity:.1;transform:translateY(0)}50%{opacity:.22;transform:translateY(-10px)}}
    .kf-sway{animation:kfSway 6s ease-in-out infinite}
    @keyframes kfSway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.6deg)}}
    .kf-moon{animation:kfGlow 5s ease-in-out infinite}
    @keyframes kfGlow{0%,100%{opacity:.75}50%{opacity:1}}
    .kf-motes circle{animation:kfMote 9s ease-in-out infinite}
    @keyframes kfMote{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    #kf-radioGlow{animation:kfBreathe 4.2s ease-in-out infinite}
    @keyframes kfBreathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
    #kf-needle{animation:kfNeedle 5s ease-in-out infinite}
    @keyframes kfNeedle{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
    @media (prefers-reduced-motion: reduce){.kf-flicker,.kf-smoke,.kf-sway,.kf-moon,.kf-motes circle,#kf-radioGlow,#kf-needle{animation:none}}
  </style>
</svg>
